# Builds everything automatically on GitHub's free servers:
#   • Website (installable app) on GitHub Pages
#   • Android .apk
#   • Mac .app (.dmg / .zip) and Windows .exe
# Runs on every push to main, or manually: Actions tab → "Build apps" → Run workflow.
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  website:
    name: Website (installable app)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: android-app
        run: |
          npm install
          rm -rf www && cp -r ../public www
          node configure.js
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1F4D35' --iconBackgroundColorDark '#1F4D35' --splashBackgroundColor '#FBF3E1' --splashBackgroundColorDark '#111712' || echo "icon generation skipped"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../PoornasKitchen.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Poornas-Kitchen-Android
          path: android-app/PoornasKitchen.apk

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Mac
            cmd: dist:mac
          - os: windows-latest
            name: Windows
            cmd: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build desktop app
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          rm -rf www && cp -r ../public www
          # Desktop app opens your GitHub Pages link (always the latest version, works with Firebase login),
          # falling back to the bundled copy when offline. Override by setting appUrl in app-settings.json.
          URL=$(node -p "require('../app-settings.json').appUrl || ''")
          if [ -z "$URL" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REPO="${{ github.event.repository.name }}"
            URL="https://${OWNER}.github.io/${REPO}/"
          fi
          echo "{ \"appUrl\": \"$URL\" }" > app-settings.json
          cat app-settings.json
          npm run ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: Poornas-Kitchen-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: warn
